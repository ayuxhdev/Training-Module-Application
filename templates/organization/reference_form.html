{% extends "base.html" %}
{% block content %}
<header class="page-heading">
	<h1>{% if reference_edit %}Edit{% else %}Add{% endif %} {{ reference_name }}</h1>
	<a href="{% url reference_list_url %}">Back to {{ reference_name|lower }} list</a>
</header>
<form method="post" class="form-stack">
	{% csrf_token %}
	{{ form.non_field_errors }}
	{{ form.as_p }}
	<button type="submit">Save {{ reference_name|lower }}</button>
</form>
{% endblock %}
