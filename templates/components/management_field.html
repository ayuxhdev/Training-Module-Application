{% if not field.is_hidden %}
<div class="management-field">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span><span class="visually-hidden"> (required)</span>{% endif %}</label>
  {{ field.errors }}
  {{ field }}
  {% if field.help_text %}<div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
</div>
{% endif %}
